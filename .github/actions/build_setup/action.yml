name: Build Setup
description: Setup for standard Java builds

runs:
  using: 'composite'

  steps:
  - name: Set up JDK 26
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: 26

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v5
    with:
      generate-job-summary: false
      gradle-home-cache-includes: |
        caches
        notifications
        jdks
        wrapper
