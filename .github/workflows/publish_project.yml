# Publishes the project to GitHub Releases
name: Publish Project

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-reloaded.[0-9]+' # e.g. v2.8.10-reloaded.1; upstream's own tags never match

concurrency:
  group: publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to create GitHub releases

    env:
      DISABLE_BUILDSCRIPT_UPDATE_CHECK: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Build
        uses: ./.github/actions/build_setup

      # When updating to RFG 2.0, enable Gradle Configuration Cache
      # https://github.com/gradle/actions/blob/main/docs/setup-gradle.md#saving-configuration-cache-data
      - name: Build Project
        run: ./gradlew build --warning-mode all --build-cache

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: "build/libs/*.jar"
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
