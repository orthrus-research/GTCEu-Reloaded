  <title id="title">Stepped G — Monochrome Remaster</title>
  <desc id="description">A geometric remaster of the supplied pixel emblem. One editable closed vector path, solid black fill, white outline, and a transparent background. The stepped silhouette and open counter are preserved; the original offset shadow is omitted.</desc>
