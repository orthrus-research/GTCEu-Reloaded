plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.diffplug.spotless' version '8.0.0'
}
group = 'gregtech'
version = modVersion
base.archivesName = modArchivesBaseName
def targetJavaFeature = providers.gradleProperty('javaVersion').get().toInteger()
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaFeature)
    withSourcesJar()
}
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.cleanroommc.com'
        content { includeGroup 'mezz' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.gtceu.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}
// Local game/tooling inputs are not dependencies of the published mod.
configurations {
    developmentOnly
    compileClasspath.extendsFrom developmentOnly
    runtimeClasspath.extendsFrom developmentOnly
    testCompileClasspath.extendsFrom developmentOnly
    testRuntimeClasspath.extendsFrom developmentOnly
}
dependencies {
    // Optional integrations may embed older Mixin classes; compile against the loader's API first.
    compileOnly 'com.cleanroommc:cleanmix:0.9.0'
    developmentOnly cleanroom.userdev(cleanroomVersion) {
        accessTransformers.from('src/main/resources/META-INF/gregtech_at.cfg')
    }
    compileOnlyApi 'org.jetbrains:annotations:24.1.0'
    developmentOnly 'org.apache.groovy:groovy:4.0.30'
    compileOnly 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.20.1'
    developmentOnly('mezz:jei:4.36.1:dev') { transitive = false }
    compileOnly deobf('curse.maven:top-245211:2667280')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
apply from: 'dependencies.gradle'
// Optional-mod interfaces are compile fixtures, never bundled implementations.
sourceSets {
    api {
        compileClasspath += sourceSets.main.compileClasspath
    }
    main {
        compileClasspath += sourceSets.api.output
    }
    test {
        compileClasspath += sourceSets.api.output
        runtimeClasspath += sourceSets.api.output
    }
}
def constantsDirectory = layout.buildDirectory.dir('generated/sources/reloaded')
tasks.register('generateModConstants') {
    inputs.properties(modName: modName, modVersion: project.version, javaVersion: targetJavaFeature, modularUiVersion: modularUiVersion)
    outputs.dir(constantsDirectory)
    doLast {
        def destination = constantsDirectory.get().file('gregtech/GTInternalTags.java').asFile
        destination.parentFile.mkdirs()
        destination.setText("""package gregtech;
public final class GTInternalTags {
    public static final String MOD_NAME = "${modName}";
    public static final String VERSION = "${project.version}";
    public static final int JAVA_VERSION = ${targetJavaFeature};
    public static final String MODULAR_UI_VERSION = "${modularUiVersion}";
    private GTInternalTags() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(constantsDirectory)
tasks.named('compileJava') { dependsOn 'generateModConstants' }
tasks.named('sourcesJar') { dependsOn 'generateModConstants' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaFeature
}
// CleanMix emits shadow/overwrite member mappings separately from the injection refmap.
// Merge them with the loader mappings so the production JAR uses both sets.
def mixinMappings = layout.buildDirectory.file('generated/mixin/mcp2srg.tsrg')
tasks.named('compileJava', JavaCompile) {
    outputs.file(mixinMappings)
    options.compilerArgs += ['-AmergeBehaviour=merge', "-AoutTsrgFile=${mixinMappings.get().asFile.absolutePath}"]
    doFirst { mixinMappings.get().asFile.parentFile.mkdirs() }
}
tasks.named('reobfJar') {
    dependsOn tasks.compileJava
    map.setFrom(mixinMappings)
}
processResources {
    inputs.property('packagedTextLineEndings', 'LF')
    def values = [modid: modId, modname: modName, version: project.version, mcversion: minecraftVersion]
    inputs.properties(values)
    filesMatching('mcmod.info') { expand(values) }
    // Archives must not depend on the checkout's line-ending convention.
    filesMatching(['**/*.json', '**/*.lang', '**/*.mcmeta', '**/*.cfg', '**/*.info',
                   '**/*.properties', '**/*.frag', '**/*.vert']) {
        filter(org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'),
            tab: org.apache.tools.ant.filters.FixCrLfFilter.AddAsisRemove.newInstance('asis'),
            eof: org.apache.tools.ant.filters.FixCrLfFilter.AddAsisRemove.newInstance('asis'), fixlast: false)
    }
}
jar {
    inputs.property('packagedTextLineEndings', 'LF')
    manifest.attributes('ModType': 'CRL', 'FMLAT': 'gregtech_at.cfg',
        'MixinConnector': 'gregtech.mixins.GregTechMixinConnector',
        'Implementation-Title': modName, 'Implementation-Version': project.version)
    from('LICENSE') { into 'META-INF' }
    from('NOTICE.md') {
        into 'META-INF'
        filter(org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'),
            tab: org.apache.tools.ant.filters.FixCrLfFilter.AddAsisRemove.newInstance('asis'),
            eof: org.apache.tools.ant.filters.FixCrLfFilter.AddAsisRemove.newInstance('asis'), fixlast: false)
    }
}
test {
    useJUnitPlatform()
    systemProperty 'crl.dev.extrapath', sourceSets.main.output.classesDirs.asPath
    doFirst {
        def ioDirectory = new File(temporaryDir, 'io')
        ioDirectory.mkdirs()
        systemProperty 'java.io.tmpdir', ioDirectory.absolutePath
    }
    classpath += configurations._cleanroomUserdevNatives
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        toggleOffOn()
        importOrderFile('spotless.importorder')
        removeUnusedImports()
        endWithNewline()
        eclipse('4.37').configFile('spotless.eclipseformat.xml')
    }
}
// Default consumers must receive production (SRG) names. The MCP archive is an explicit development classifier.
['apiElements', 'runtimeElements'].each { name ->
    configurations[name].outgoing.artifacts.clear()
    configurations[name].outgoing.artifact(tasks.reobfJar) { classifier = null }
}
publishing {
    publications {
        mod(MavenPublication) {
            artifactId = modArchivesBaseName
            from components.java
            artifact(tasks.jar) { classifier = 'mcp' }
        }
    }
}

// Keep the engine boundary enforceable after the migration, including transitive dependencies.
tasks.register('verifyDefinitionBoundary') {
    dependsOn tasks.reobfJar
    doLast {
        def dependencyGraphs = [:]
        ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
            dependencyGraphs[name] = configurations[name].incoming.resolutionResult.allComponents.collect {
                it.id.displayName
            }.sort()
        }
        def forbiddenDependencies = dependencyGraphs.collectMany { name, dependencies ->
            dependencies.findAll { it.toLowerCase(Locale.ROOT) =~ /crafttweaker|zenscript/ }
                .collect { "${name}: ${it}" }
        }
        def forbiddenClasses = []
        def wrongBytecode = []
        def artifactFile = tasks.reobfJar.outputs.files.singleFile
        new java.util.zip.ZipFile(artifactFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (!entry.name.endsWith('.class')) return
                byte[] bytes = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (['crafttweaker/', 'crafttweaker.', 'stanhebben/zenscript', 'stanhebben.zenscript', 'getAllElementsCT']
                    .any { constants.contains(it) }) forbiddenClasses.add(entry.name)
                if ((((bytes[6] & 255) << 8) | (bytes[7] & 255)) != 44 + (targetJavaFeature)) wrongBytecode.add(entry.name)
            }
        }
        def report = layout.buildDirectory.file('reports/definition-boundary.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            dependencies: dependencyGraphs, forbiddenDependencies: forbiddenDependencies,
            forbiddenClasses: forbiddenClasses, wrongBytecode: wrongBytecode]))
        if (forbiddenDependencies || forbiddenClasses || wrongBytecode) {
            throw new GradleException("Definition boundary violation; see ${report}")
        }
    }
}
tasks.named('check') { dependsOn 'verifyDefinitionBoundary' }

// A valid refmap alone does not prove that shadow fields in the packaged classes were renamed.
tasks.register('verifyMixinMappings') {
    dependsOn tasks.reobfJar
    inputs.file(mixinMappings)
    inputs.files(tasks.reobfJar.outputs.files)
    doLast {
        def members = mixinMappings.get().asFile.readLines('UTF-8')
            .findAll { it.startsWith('gregtech/') }
            .collect { it.trim().split(/\s+/) }
            .findAll { it.length == 3 || it.length == 4 }
        def failures = []
        if (!members) failures.add('No GregTech shadow or overwrite member mappings were emitted')
        def armorMixin = 'gregtech/mixins/forge/SpecialArmorPropertiesMixin'
        def armorTarget = 'Lnet/minecraft/util/CombatRules;getDamageAfterAbsorb(FFF)F'
        def armorMappedTarget = 'Lnet/minecraft/util/CombatRules;func_189427_a(FFF)F'
        def injectionMappings = [:]
        new java.util.zip.ZipFile(tasks.reobfJar.outputs.files.singleFile).withCloseable { archive ->
            def refmapEntry = archive.getEntry('mixins.gregtech.refmap.json')
            if (refmapEntry == null) {
                failures.add('Missing packaged injection refmap')
            } else {
                def refmap = archive.getInputStream(refmapEntry).withCloseable {
                    new groovy.json.JsonSlurper().parse(it)
                }
                injectionMappings = refmap.mappings?.get(armorMixin) ?: [:]
                if (injectionMappings[armorTarget] != armorMappedTarget) {
                    failures.add('Armor injection does not remap its Minecraft invocation target')
                }
                if (injectionMappings.containsKey('applyArmor')) {
                    failures.add('Forge applyArmor selector must retain its native name')
                }
            }
            members.each { mapping ->
                def entry = archive.getEntry(mapping[0] + '.class')
                if (entry == null) {
                    failures.add("Missing mapped class: ${mapping[0]}")
                    return
                }
                def model = java.lang.classfile.ClassFile.of().parse(
                    archive.getInputStream(entry).withCloseable { it.readAllBytes() })
                boolean found = mapping.length == 3 ?
                    model.fields().any { it.fieldName().stringValue() == mapping[2] } :
                    model.methods().any { it.methodName().stringValue() == mapping[3] &&
                        it.methodType().stringValue() == mapping[2] }
                if (!found) failures.add("Unmapped member: ${mapping.join(' ')}")
            }
        }
        def report = layout.buildDirectory.file('reports/mixin-mappings.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            members: members.collect { it.toList() }, armorInjection: injectionMappings, failures: failures]))
        if (failures) throw new GradleException("Mixin member remapping failed; see ${report}")
    }
}
tasks.named('check') { dependsOn 'verifyMixinMappings' }

// Keep development engines, loader userdev bundles and optional integrations out of consumer metadata.
tasks.register('verifyPublicationMetadata') {
    dependsOn 'generatePomFileForModPublication', 'generateMetadataFileForModPublication'
    doLast {
        def module = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('publications/mod/module.json').get().asFile)
        def required = ['maven.modrinth:KphJPRlN', 'com.cleanroommc:modularui'] as Set
        def allowedCompile = required + ['org.jetbrains:annotations']
        def failures = []
        ['apiElements': allowedCompile, 'runtimeElements': required].each { name, expected ->
            def variant = module.variants.find { it.name == name }
            def actual = variant?.dependencies?.collect { "${it.group}:${it.module}".toString() } as Set
            if (actual != expected) failures.add("${name} dependencies: ${actual}")
            if (variant?.attributes?.get('org.gradle.jvm.version') != (targetJavaFeature)) failures.add("${name} does not require Java ${targetJavaFeature}")
            def product = tasks.reobfJar.outputs.files.singleFile
            def sha = java.security.MessageDigest.getInstance('SHA-256').digest(product.bytes).encodeHex().toString()
            if (variant?.files?.size() != 1 || variant.files[0].sha256 != sha || variant.files[0].name.endsWith('-mcp.jar')) {
                failures.add("${name} does not publish the exact production artifact")
            }
        }
        def pom = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder()
            .parse(layout.buildDirectory.file('publications/mod/pom-default.xml').get().asFile)
        def dependencies = pom.getElementsByTagName('dependency')
        def published = [] as Set
        for (int i = 0; i < dependencies.length; i++) {
            def dependency = dependencies.item(i)
            published.add(dependency.getElementsByTagName('groupId').item(0).textContent + ':' +
                dependency.getElementsByTagName('artifactId').item(0).textContent)
        }
        if (published != allowedCompile) failures.add("POM dependencies: ${published}")
        def report = layout.buildDirectory.file('reports/publication-metadata.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([dependencies: published, failures: failures]))
        if (failures) throw new GradleException("Consumer metadata violation; see ${report}")
    }
}
tasks.named('check') { dependsOn 'verifyPublicationMetadata' }
apply from: 'gradle/runtime-baseline.gradle'
