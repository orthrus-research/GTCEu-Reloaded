# GTCEu: Reloaded's checks. Workbench runs them from a clean clone on Temurin 26.0.2.1+1
# (`wb run ci.run project=gtceur`), and its pre-push hook (`wb run ci.hook project=gtceur`) refuses a commit whose
# tree has not passed them. Without Workbench: `./gradlew spotlessCheck build` with JAVA_HOME at JDK 26.
[settings]
name = "gtceur"
workflow = "ci"
identity_files = ["{env.JAVA_HOME}/release"]

# OrthLib is a checkout the build only takes its pinned commit from: gradle.properties pins its JARs by commit and
# SHA-256, and refreshOrthLib builds them in a worktree of the checkout at that commit. Its own tree is not tested.
[repositories.orthlib]
path = "../OrthLib"
tested = false

[workflows]
ci = ["format", "build"]

[jobs.format]
description = "The formatting check: Spotless with the Eclipse 4.37 formatter and the import order"
locks = ["gradle"]
memory = 4
priority = 10
# A pure check: its pass stands while the sources, the formatter settings and the build scripts are unchanged.
inputs = [
  "src/main/java/**/*.java", "src/test/java/**/*.java", "spotless.eclipseformat.xml", "spotless.importorder",
  ".gitattributes", "build.gradle", "settings.gradle", "gradle.properties", "dependencies.gradle", "gradle/*.gradle",
  "gradle/wrapper/*", "gradlew", "src/main/resources/META-INF/gregtech_at.cfg",
]
steps = [{ name = "spotlessCheck", run = ["bash", "gradlew", "spotlessCheck", "--no-daemon", "--console=plain"] }]

[jobs.build]
description = "Put the pinned OrthLib JARs in place, then build and test on Java 26, with the definition boundary, mixin mapping, publication metadata and runtime baseline checks"
locks = ["gradle"]
memory = 6
steps = [
  # OrthLib's build takes Java 8 for its reobfuscation as well as this build's Java.
  { name = "orthlib", run = ["bash", "gradlew", "refreshOrthLib", "--no-daemon", "--console=plain", "-PorthlibCheckout={orthlib}", "-Porg.gradle.java.installations.paths={env.JAVA_HOME},{env.JAVA_HOME_8_X64}"] },
  { name = "build", run = ["bash", "gradlew", "build", "--no-daemon", "--console=plain"] },
]

[[quick.gtceur]]
paths = ["docs/**", "**/*.md", "LICENSE", "**/LICENSE.txt"]
jobs = []
